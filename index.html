<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ma-thi-ơ 2 Game</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1e1e2e">
  <style>
    :root {
      --bg: #11111b;
      --card: #1e1e2e;
      --card-active: #313244;
      --accent: #89b4fa;
      --text: #cdd6f4;
      --dim: #a6adc8;
      --green: #a6e3a1;
      --green-bg: rgba(166, 227, 161, 0.2);
      --red: #f38ba8;
      --red-bg: rgba(243, 139, 168, 0.2);
      --border: #45475a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .streak { font-size: 0.9rem; font-weight: bold; color: #f9e2af; }
    .day-slider {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .day-slider::-webkit-scrollbar { display: none; }
    .day-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--dim);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .day-btn.active {
      background: var(--accent);
      color: #11111b;
      font-weight: bold;
      border-color: var(--accent);
    }
    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: var(--card-active);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s ease;
    }
    .game-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .prompt-label {
      font-size: 0.8rem;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .sentence-display {
      font-size: 1.15rem;
      line-height: 1.8;
      margin-bottom: 24px;
    }
    .blank {
      display: inline-block;
      min-width: 60px;
      padding: 2px 8px;
      border-bottom: 3px solid var(--accent);
      color: var(--accent);
      font-weight: bold;
      text-align: center;
      background: rgba(137, 180, 250, 0.1);
      border-radius: 4px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .opt-btn {
      background: #181825;
      border: 2px solid var(--border);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      padding: 16px 8px;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .opt-btn:active { transform: scale(0.97); }
    .opt-btn.correct {
      background: var(--green-bg);
      border-color: var(--green);
      color: var(--green);
    }
    .opt-btn.wrong {
      background: var(--red-bg);
      border-color: var(--red);
      color: var(--red);
    }
    .feedback-banner {
      min-height: 44px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 0.9rem;
      font-weight: bold;
    }
    .next-btn {
      background: var(--accent);
      color: #11111b;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }
    .tab-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--dim);
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--card-active);
      color: var(--text);
      border-color: var(--accent);
    }
    .read-text {
      font-size: 1.05rem;
      line-height: 1.8;
      white-space: pre-line;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <header>
    <div style="font-size: 1.1rem; font-weight: bold; color: var(--accent);" id="titleDay">Ngày 1</div>
    <div class="streak" id="scoreDisplay">Điểm: 0</div>
  </header>

  <div class="day-slider" id="dayBar"></div>

  <div class="tab-nav">
    <button class="mode-btn active" id="btnGame" onclick="switchView('game')">Luyện Trắc Nghiệm</button>
    <button class="mode-btn" id="btnRead" onclick="switchView('read')">Đọc Bản Văn Gốc</button>
  </div>

  <div class="progress-bar-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- Khu vực chơi Mini-Game -->
  <div class="game-box" id="gameArea">
    <div>
      <div class="prompt-label" id="clozeLabel">Chọn từ / dấu câu chính xác:</div>
      <div class="sentence-display" id="sentenceBox">...</div>
    </div>

    <div>
      <div class="options-grid" id="optionsBox"></div>
      <div class="feedback-banner" id="banner">
        <span id="bannerText"></span>
        <button class="next-btn" id="btnNext" onclick="nextQuestion()">Tiếp tục ➔</button>
      </div>
    </div>
  </div>

  <!-- Khu vực đọc trước bản gốc -->
  <div class="game-box" id="readArea" style="display: none;">
    <div class="read-text" id="fullVerseText"></div>
  </div>

  <script>
    const bibleVerses = [
      { day: 1, range: "Câu 1 - 2", text: "1 Khi Đức Chúa Jêsus đã sanh tại thành Bết-lê-hem, xứ Giu-đê, đang đời vua Hê-rốt, có mấy thầy bác sĩ ở đông phương đến thành Giê-ru-sa-lem,\n2 mà hỏi rằng: Vua dân Giu-đa mới sanh tại đâu? Vì chúng ta đã thấy ngôi sao Ngài bên đông phương, nên đến đặng thờ lạy Ngài." },
      { day: 2, range: "Câu 3 - 4", text: "3 Nghe tin ấy, vua Hê-rốt cùng cả thành Giê-ru-sa-lem đều bối rối.\n4 Vua bèn nhóm các thầy tế lễ cả và các thầy thông giáo trong dân lại, mà tra hỏi rằng Đấng Christ phải sanh tại đâu." },
      { day: 3, range: "Câu 5 - 6", text: "5 Các thầy ấy tâu rằng: Tại Bết-lê-hem, xứ Giu-đê; vì có lời đấng tiên tri chép như vầy:\n6 Hỡi Bết-lê-hem, đất Giu-đa! Thật ngươi chẳng kém gì các thành lớn của xứ Giu-đa đâu, vì từ ngươi sẽ ra một quan tướng, là Đấng chăn dân Y-sơ-ra-ên của ta." },
      { day: 4, range: "Câu 7 - 8", text: "7 Vua Hê-rốt bèn vời mấy thầy bác sĩ cách kín nhiệm, hỏi kỹ càng về ngôi sao đã hiện ra khi nào.\n8 Rồi vua sai mấy thầy đó đến thành Bết-lê-hem, và dặn rằng: Hãy đi hỏi thăm cho kỹ về con trẻ đó; khi tìm được rồi, hãy cho ta biết, đặng ta cũng đến mà thờ lạy Ngài." },
      { day: 5, range: "Câu 9 - 10", text: "9 Mấy thầy nghe vua phán xong, liền đi. Kìa, ngôi sao mà họ đã thấy bên đông phương, đi trước họ cho đến chừng tới nơi con trẻ ở, mới dừng lại trên đầu.\n10 Mấy thầy thấy ngôi sao, mừng rỡ quá bội." },
      { day: 6, range: "Câu 11 - 12", text: "11 Khi vào đến nhà, thấy con trẻ cùng Ma-ri, mẹ Ngài, thì sấp mình xuống mà thờ lạy Ngài; rồi mở hộp châu báu ra, dâng cho Ngài những lễ vật, là vàng, nhũ hương, và một dược.\n12 Kế đó, trong chiêm bao họ được Đức Chúa Trời mách bảo đừng trở lại nơi vua Hê-rốt; nên họ đi đường khác mà về xứ mình." },
      { day: 7, range: "Ôn tập Câu 1-12", text: "1 Khi Đức Chúa Jêsus đã sanh tại thành Bết-lê-hem, xứ Giu-đê, đang đời vua Hê-rốt, có mấy thầy bác sĩ ở đông phương đến thành Giê-ru-sa-lem,\n2 mà hỏi rằng: Vua dân Giu-đa mới sanh tại đâu? Vì chúng ta đã thấy ngôi sao Ngài bên đông phương, nên đến đặng thờ lạy Ngài.\n11 Khi vào đến nhà, thấy con trẻ cùng Ma-ri, mẹ Ngài, thì sấp mình xuống mà thờ lạy Ngài; rồi mở hộp châu báu ra, dâng cho Ngài những lễ vật, là vàng, nhũ hương, và một dược." },
      { day: 8, range: "Câu 13 - 14", text: "13 Sau khi mấy thầy đó đi rồi, có một thiên sứ của Chúa hiện đến cùng Giô-sép trong chiêm bao, mà truyền rằng: Hãy chờ dậy, đem con trẻ và mẹ Ngài trốn sang xứ Ê-díp-tô, rồi cứ ở đó cho tới chừng nào ta bảo ngươi; vì vua Hê-rốt toan kiếm con trẻ ấy mà giết.\n14 Giô-sép bèn chờ dậy, đem con trẻ và mẹ Ngài đi ban đêm, lánh qua xứ Ê-díp-tô." },
      { day: 9, range: "Câu 15 - 16", text: "15 Người ở đó cho tới khi vua Hê-rốt băng, đặng cho ứng nghiệm lời Chúa đã phán bởi đấng tiên tri rằng: Ta đã gọi con ta ra khỏi xứ Ê-díp-tô.\n16 Vua Hê-rốt thấy mình đã bị mấy thầy bác sĩ đánh lừa, thì tức giận quá, bèn sai giết hết thảy con trai từ hai tuổi sấp xuống ở thành Bết-lê-hem và cả hạt, theo đúng ngày tháng mà vua đã cẩn thận hỏi các thầy bác sĩ." },
      { day: 10, range: "Câu 17 - 18", text: "17 Vậy là ứng nghiệm lời đấng tiên tri Giê-rê-mi đã nói rằng:\n18 Người ta có nghe tiếng kêu la, than khóc, thảm sầu tại Ra-ma: Ấy là Ra-chên khóc các con mình, mà không chịu yên ủi, vì chúng nó không còn nữa." },
      { day: 11, range: "Câu 19 - 20", text: "19 Nhưng sau khi vua Hê-rốt băng, có một thiên sứ của Chúa hiện đến cùng Giô-sép trong chiêm bao, tại xứ Ê-díp-tô, mà truyền rằng:\n20 Hãy chờ dậy, đem con trẻ và mẹ Ngài trở về xứ Y-sơ-ra-ên; vì những kẻ toan giết con trẻ đã chết rồi." },
      { day: 12, range: "Câu 21 - 23", text: "21 Giô-sép bèn chờ dậy, đem con trẻ và mẹ Ngài trở về xứ Y-sơ-ra-ên.\n22 Song vì nghe vua A-chê-la-u nối ngôi vua cha là Hê-rốt mà trị vì tại xứ Giu-đê, nên Giô-sép sợ không dám về đó; và bởi được Đức Chúa Trời mách bảo trong chiêm bao, người bèn dời qua xứ Ga-li-lê,\n23 đến ngụ tại một thành gọi là Na-xa-rét. Như vậy đặng ứng nghiệm lời các đấng tiên tri đã nói rằng: Người ta sẽ gọi Ngài là người Na-xa-rét." },
      { day: 13, range: "Ôn tập Câu 13-23", text: "13 Sau khi mấy thầy đó đi rồi, có một thiên sứ của Chúa hiện đến cùng Giô-sép trong chiêm bao, mà truyền rằng: Hãy chờ dậy, đem con trẻ và mẹ Ngài trốn sang xứ Ê-díp-tô.\n22 Song vì nghe vua A-chê-la-u nối ngôi vua cha là Hê-rốt mà trị vì tại xứ Giu-đê, nên Giô-sép sợ không dám về đó." },
      { day: 14, range: "Tổng duyệt 23 câu", text: "1 Khi Đức Chúa Jêsus đã sanh tại thành Bết-lê-hem, xứ Giu-đê, đang đời vua Hê-rốt.\n8 đặng ta cũng đến mà thờ lạy Ngài.\n14 Giô-sép bèn chờ dậy, đem con trẻ và mẹ Ngài đi ban đêm, lánh qua xứ Ê-díp-tô.\n23 đến ngụ tại một thành gọi là Na-xa-rét." }
    ];

    // Ngân hàng gây nhiễu cho từ nối bản dịch 1925 và dấu câu
    const distractorsLib = {
      punctuation: [",", ";", ".", ":", "!"],
      connectors: ["bèn", "đặng", "song", "kìa", "vậy", "liền", "mà", "và", "nhưng", "kế đó"],
      general: ["sanh", "băng", "chiêm bao", "kín nhiệm", "hạt", "thờ lạy", "chờ dậy", "đến", "thấy"]
    };

    let activeDay = 0;
    let questions = [];
    let qIndex = 0;
    let score = 0;
    let answered = false;

    function initDays() {
      const bar = document.getElementById('dayBar');
      bar.innerHTML = '';
      bibleVerses.forEach((d, idx) => {
        const btn = document.createElement('button');
        btn.className = `day-btn ${idx === activeDay ? 'active' : ''}`;
        btn.textContent = `N${d.day}: ${d.range}`;
        btn.onclick = () => selectDay(idx);
        bar.appendChild(btn);
      });
    }

    function selectDay(idx) {
      activeDay = idx;
      initDays();
      document.getElementById('titleDay').textContent = `Ngày ${bibleVerses[idx].day} • ${bibleVerses[idx].range}`;
      document.getElementById('fullVerseText').textContent = bibleVerses[idx].text;
      buildQuestions();
      qIndex = 0;
      loadQuestion();
    }

    // Tách câu và tạo bài tập điền khuyết tự động
    function buildQuestions() {
      questions = [];
      const lines = bibleVerses[activeDay].text.split('\n');

      lines.forEach(line => {
        // Tách token bao gồm cả chữ và dấu chấm câu
        const tokens = line.match(/[\w\u00C0-\u1EF9-]+|[^\s\w\u00C0-\u1EF9-]+/g) || [];
        
        tokens.forEach((token, tIdx) => {
          // Bỏ qua số thứ tự câu
          if (/^\d+$/.test(token)) return;

          let isTarget = false;
          let type = '';

          if ([',', ';', ':', '.'].includes(token)) {
            isTarget = Math.random() < 0.45; // Test dấu câu
            type = 'punctuation';
          } else if (distractorsLib.connectors.includes(token.toLowerCase()) || distractorsLib.general.includes(token.toLowerCase())) {
            isTarget = true; // Ưu tiên test từ ngữ đặc trưng 1925
            type = 'word';
          } else if (token.length >= 3 && Math.random() < 0.2) {
            isTarget = true;
            type = 'word';
          }

          if (isTarget) {
            // Tạo 4 phương án
            let choices = [token];
            let pool = type === 'punctuation' 
              ? distractorsLib.punctuation 
              : [...distractorsLib.connectors, ...distractorsLib.general];

            while (choices.length < 4) {
              let rand = pool[Math.floor(Math.random() * pool.length)];
              if (!choices.includes(rand)) choices.push(rand);
            }
            choices.sort(() => Math.random() - 0.5);

            // Tạo đoạn văn có khoảng trống
            let before = tokens.slice(Math.max(0, tIdx - 8), tIdx).join(' ').replace(/\s+([,.;:])/g, '$1');
            let after = tokens.slice(tIdx + 1, Math.min(tokens.length, tIdx + 9)).join(' ').replace(/\s+([,.;:])/g, '$1');

            questions.push({
              target: token,
              before: (tIdx > 8 ? '...' : '') + before,
              after: after + (tIdx + 9 < tokens.length ? '...' : ''),
              choices: choices
            });
          }
        });
      });

      // Trộn thứ tự câu hỏi và giới hạn mỗi phiên 10-12 câu
      questions = questions.sort(() => Math.random() - 0.5).slice(0, 12);
    }

    function loadQuestion() {
      answered = false;
      document.getElementById('banner').style.background = 'transparent';
      document.getElementById('bannerText').textContent = '';
      document.getElementById('btnNext').style.display = 'none';

      if (questions.length === 0) {
        document.getElementById('sentenceBox').textContent = "Không tìm thấy dữ liệu câu hỏi cho ngày này.";
        return;
      }

      const q = questions[qIndex];
      const percent = ((qIndex) / questions.length) * 100;
      document.getElementById('progressBar').style.width = `${percent}%`;

      document.getElementById('sentenceBox').innerHTML = `${q.before} <span class="blank" id="blankWord">_____</span> ${q.after}`;

      const optionsBox = document.getElementById('optionsBox');
      optionsBox.innerHTML = '';
      q.choices.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.textContent = opt;
        b.onclick = () => checkAnswer(b, opt, q.target);
        optionsBox.appendChild(b);
      });
    }

    function checkAnswer(buttonEl, selected, correct) {
      if (answered) return;
      answered = true;

      const blank = document.getElementById('blankWord');
      blank.textContent = correct;

      const isRight = selected.toLowerCase() === correct.toLowerCase();
      if (isRight) {
        buttonEl.classList.add('correct');
        blank.style.color = 'var(--green)';
        document.getElementById('banner').style.background = 'var(--green-bg)';
        document.getElementById('bannerText').innerHTML = `<span style="color:var(--green)">Chính xác! ✓</span>`;
        score += 10;
      } else {
        buttonEl.classList.add('wrong');
        blank.style.color = 'var(--red)';
        document.getElementById('banner').style.background = 'var(--red-bg)';
        document.getElementById('bannerText').innerHTML = `<span style="color:var(--red)">Sai rồi! Đáp án: <b>${correct}</b></span>`;
        
        // Đánh dấu nút đúng
        document.querySelectorAll('.opt-btn').forEach(b => {
          if (b.textContent.toLowerCase() === correct.toLowerCase()) {
            b.classList.add('correct');
          }
        });
      }

      document.getElementById('scoreDisplay').textContent = `Điểm: ${score}`;
      document.getElementById('btnNext').style.display = 'block';
    }

    function nextQuestion() {
      qIndex++;
      if (qIndex >= questions.length) {
        document.getElementById('progressBar').style.width = '100%';
        document.getElementById('sentenceBox').innerHTML = `<div style="text-align:center; color:var(--green); font-weight:bold; font-size:1.3rem;">🎉 Hoàn thành phiên luyện tập!</div>`;
        document.getElementById('optionsBox').innerHTML = '';
        document.getElementById('bannerText').textContent = `Tổng điểm: ${score}`;
        document.getElementById('btnNext').style.display = 'none';
      } else {
        loadQuestion();
      }
    }

    function switchView(mode) {
      if (mode === 'game') {
        document.getElementById('gameArea').style.display = 'flex';
        document.getElementById('progressWrap').style.display = 'block';
        document.getElementById('readArea').style.display = 'none';
        document.getElementById('btnGame').classList.add('active');
        document.getElementById('btnRead').classList.remove('active');
      } else {
        document.getElementById('gameArea').style.display = 'none';
        document.getElementById('progressWrap').style.display = 'none';
        document.getElementById('readArea').style.display = 'flex';
        document.getElementById('btnGame').classList.remove('active');
        document.getElementById('btnRead').classList.add('active');
      }
    }

    // Khởi động
    initDays();
    selectDay(0);
  </script>
</body>
</html>

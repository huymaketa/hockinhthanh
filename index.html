<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ma-thi-ơ 2 Hardcore</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#181825">
  <style>
    :root {
      --bg: #11111b;
      --card: #1e1e2e;
      --accent: #89b4fa;
      --text: #cdd6f4;
      --dim: #a6adc8;
      --green: #a6e3a1;
      --red: #f38ba8;
      --border: #313244;
      --input-bg: #181825;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .streak { font-size: 0.9rem; font-weight: bold; color: #f9e2af; }
    
    .day-slider {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .day-slider::-webkit-scrollbar { display: none; }
    .day-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--dim);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .day-btn.active {
      background: var(--accent);
      color: #11111b;
      font-weight: bold;
      border-color: var(--accent);
    }

    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: #313244;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    .game-box {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s, transform 0.2s;
    }

    /* Hiệu ứng rung lắc khi sai */
    .shake-anim {
      animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      border-color: var(--red) !important;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    /* Hiệu ứng nảy xanh khi đúng */
    .correct-anim {
      animation: popGreen 0.6s ease-out both;
      border-color: var(--green) !important;
    }
    @keyframes popGreen {
      0% { transform: scale(1); box-shadow: 0 0 0 rgba(166, 227, 161, 0); }
      40% { transform: scale(1.02); box-shadow: 0 0 25px rgba(166, 227, 161, 0.4); }
      100% { transform: scale(1); }
    }

    .prompt-label {
      font-size: 0.8rem;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    .sentence-display {
      font-size: 1.15rem;
      line-height: 1.8;
      margin-bottom: 20px;
    }
    .blank {
      display: inline-block;
      min-width: 80px;
      padding: 2px 8px;
      border-bottom: 3px solid var(--accent);
      color: var(--accent);
      font-weight: bold;
      text-align: center;
      background: rgba(137, 180, 250, 0.1);
      border-radius: 4px;
    }

    .input-group {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .text-input {
      width: 100%;
      background: var(--input-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 1.05rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .text-input:focus { border-color: var(--accent); }

    .btn-action {
      background: var(--accent);
      color: #11111b;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-action:active { opacity: 0.85; }

    /* Modal Chế Giễu */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
      backdrop-filter: blur(3px);
    }
    .modal-box {
      background: #181825;
      border: 2px solid var(--red);
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      width: 100%;
      max-width: 380px;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .mock-title {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--red);
      margin-bottom: 8px;
    }
    .mock-desc {
      font-size: 0.95rem;
      color: var(--dim);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .answer-reveal {
      background: #11111b;
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed var(--border);
      color: var(--green);
      font-weight: bold;
      margin-bottom: 20px;
      word-break: break-word;
    }
    .btn-retry {
      background: var(--red);
      color: #11111b;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.95rem;
      width: 100%;
      cursor: pointer;
    }

    .tab-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--dim);
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #313244;
      color: var(--text);
      border-color: var(--accent);
    }
    .read-text {
      font-size: 1.05rem;
      line-height: 1.8;
      white-space: pre-line;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <header>
    <div style="font-size: 1.1rem; font-weight: bold; color: var(--accent);" id="titleDay">Ngày 1</div>
    <div class="streak" id="scoreDisplay">Chuỗi đúng: 0</div>
  </header>

  <div class="day-slider" id="dayBar"></div>

  <div class="tab-nav">
    <button class="mode-btn active" id="btnGame" onclick="switchView('game')">Luyện Gõ Nghiêm Ngặt</button>
    <button class="mode-btn" id="btnRead" onclick="switchView('read')">Đọc Bản Văn Gốc</button>
  </div>

  <div class="progress-bar-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="game-box" id="gameArea">
    <div>
      <div class="prompt-label">
        <span>Gõ chính xác tuyệt đối (hoa/thường/dấu)</span>
        <span id="wordCountHint" style="color: var(--accent);"></span>
      </div>
      <div class="sentence-display" id="sentenceBox">...</div>
    </div>

    <div class="input-group">
      <input 
        type="text" 
        id="userInput" 
        class="text-input" 
        placeholder="Gõ chuẩn từng ký tự..." 
        autocomplete="off" 
        autocorrect="off"
        autocapitalize="none" 
        spellcheck="false"
      >
      <button class="btn-action" id="btnSubmit" onclick="checkAnswer()">Kiểm Tra</button>
    </div>
  </div>

  <div class="game-box" id="readArea" style="display: none;">
    <div class="read-text" id="fullVerseText"></div>
  </div>

  <!-- Popup Chế Giễu -->
  <div class="modal-overlay" id="mockModal">
    <div class="modal-box">
      <div class="mock-title" id="mockTitleText">Sai rồi ní ơi! 🤪</div>
      <div class="mock-desc">Nhìn lại cho kỹ từng chữ hoa chữ thường với dấu câu nha:</div>
      <div class="answer-reveal" id="correctRevealText">...</div>
      <button class="btn-retry" onclick="closeModalAndRetry()">Gõ lại cho nhớ</button>
    </div>
  </div>

  <script>
    const bibleVerses = [
      { day: 1, range: "Câu 1 - 2", text: "1 Khi Đức Chúa Jêsus đã sanh tại thành Bết-lê-hem, xứ Giu-đê, đang đời vua Hê-rốt, có mấy thầy bác sĩ ở đông phương đến thành Giê-ru-sa-lem,\n2 mà hỏi rằng: Vua dân Giu-đa mới sanh tại đâu? Vì chúng ta đã thấy ngôi sao Ngài bên đông phương, nên đến đặng thờ lạy Ngài." },
      { day: 2, range: "Câu 3 - 4", text: "3 Nghe tin ấy, vua Hê-rốt cùng cả thành Giê-ru-sa-lem đều bối rối.\n4 Vua bèn nhóm các thầy tế lễ cả và các thầy thông giáo trong dân lại, mà tra hỏi rằng Đấng Christ phải sanh tại đâu." },
      { day: 3, range: "Câu 5 - 6", text: "5 Các thầy ấy tâu rằng: Tại Bết-lê-hem, xứ Giu-đê; vì có lời đấng tiên tri chép như vầy:\n6 Hỡi Bết-lê-hem, đất Giu-đa! Thật ngươi chẳng kém gì các thành lớn của xứ Giu-đa đâu, vì từ ngươi sẽ ra một quan tướng, là Đấng chăn dân Y-sơ-ra-ên của ta." },
      { day: 4, range: "Câu 7 - 8", text: "7 Vua Hê-rốt bèn vời mấy thầy bác sĩ cách kín nhiệm, hỏi kỹ càng về ngôi sao đã hiện ra khi nào.\n8 Rồi vua sai mấy thầy đó đến thành Bết-lê-hem, và dặn rằng: Hãy đi hỏi thăm cho kỹ về con trẻ đó; khi tìm được rồi, hãy cho ta biết, đặng ta cũng đến mà thờ lạy Ngài." },
      { day: 5, range: "Câu 9 - 10", text: "9 Mấy thầy nghe vua phán xong, liền đi. Kìa, ngôi sao mà họ đã thấy bên đông phương, đi trước họ cho đến chừng tới nơi con trẻ ở, mới dừng lại trên đầu.\n10 Mấy thầy thấy ngôi sao, mừng rỡ quá bội." },
      { day: 6, range: "Câu 11 - 12", text: "11 Khi vào đến nhà, thấy con trẻ cùng Ma-ri, mẹ Ngài, thì sấp mình xuống mà thờ lạy Ngài; rồi mở hộp châu báu ra, dâng cho Ngài những lễ vật, là vàng, nhũ hương, và một dược.\n12 Kế đó, trong chiêm bao họ được Đức Chúa Trời mách bảo đừng trở lại nơi vua Hê-rốt; nên họ đi đường khác mà về xứ mình." },
      { day: 7, range: "Ôn tập Câu 1-12", text: "1 Khi Đức Chúa Jêsus đã sanh tại thành Bết-lê-hem, xứ Giu-đê, đang đời vua Hê-rốt, có mấy thầy bác sĩ ở đông phương đến thành Giê-ru-sa-lem,\n2 mà hỏi rằng: Vua dân Giu-đa mới sanh tại đâu? Vì chúng ta đã thấy ngôi sao Ngài bên đông phương, nên đến đặng thờ lạy Ngài.\n11 Khi vào đến nhà, thấy con trẻ cùng Ma-ri, mẹ Ngài, thì sấp mình xuống mà thờ lạy Ngài; rồi mở hộp châu báu ra, dâng cho Ngài những lễ vật, là vàng, nhũ hương, và một dược." },
      { day: 8, range: "Câu 13 - 14", text: "13 Sau khi mấy thầy đó đi rồi, có một thiên sứ của Chúa hiện đến cùng Giô-sép trong chiêm bao, mà truyền rằng: Hãy chờ dậy, đem con trẻ và mẹ Ngài trốn sang xứ Ê-díp-tô, rồi cứ ở đó cho tới chừng nào ta bảo ngươi; vì vua Hê-rốt toan kiếm con trẻ ấy mà giết.\n14 Giô-sép bèn chờ dậy, đem con trẻ và mẹ Ngài đi ban đêm, lánh qua xứ Ê-díp-tô." },
      { day: 9, range: "Câu 15 - 16", text: "15 Người ở đó cho tới khi vua Hê-rốt băng, đặng cho ứng nghiệm lời Chúa đã phán bởi đấng tiên tri rằng: Ta đã gọi con ta ra khỏi xứ Ê-díp-tô.\n16 Vua Hê-rốt thấy mình đã bị mấy thầy bác sĩ đánh lừa, thì tức giận quá, bèn sai giết hết thảy con trai từ hai tuổi sấp xuống ở thành Bết-lê-hem và cả hạt, theo đúng ngày tháng mà vua đã cẩn thận hỏi các thầy bác sĩ." },
      { day: 10, range: "Câu 17 - 18", text: "17 Vậy là ứng nghiệm lời đấng tiên tri Giê-rê-mi đã nói rằng:\n18 Người ta có nghe tiếng kêu la, than khóc, thảm sầu tại Ra-ma: Ấy là Ra-chên khóc các con mình, mà không chịu yên ủi, vì chúng nó không còn nữa." },
      { day: 11, range: "Câu 19 - 20", text: "19 Nhưng sau khi vua Hê-rốt băng, có một thiên sứ của Chúa hiện đến cùng Giô-sép trong chiêm bao, tại xứ Ê-díp-tô, mà truyền rằng:\n20 Hãy chờ dậy, đem con trẻ và mẹ Ngài trở về xứ Y-sơ-ra-ên; vì những kẻ toan giết con trẻ đã chết rồi." },
      { day: 12, range: "Câu 21 - 23", text: "21 Giô-sép bèn chờ dậy, đem con trẻ và mẹ Ngài trở về xứ Y-sơ-ra-ên.\n22 Song vì nghe vua A-chê-la-u nối ngôi vua cha là Hê-rốt mà trị vì tại xứ Giu-đê, nên Giô-sép sợ không dám về đó; và bởi được Đức Chúa Trời mách bảo trong chiêm bao, người bèn dời qua xứ Ga-li-lê,\n23 đến ngụ tại một thành gọi là Na-xa-rét. Như vậy đặng ứng nghiệm lời các đấng tiên tri đã nói rằng: Người ta sẽ gọi Ngài là người Na-xa-rét." },
      { day: 13, range: "Ôn tập Câu 13-23", text: "13 Sau khi mấy thầy đó đi rồi, có một thiên sứ của Chúa hiện đến cùng Giô-sép trong chiêm bao, mà truyền rằng: Hãy chờ dậy, đem con trẻ và mẹ Ngài trốn sang xứ Ê-díp-tô.\n22 Song vì nghe vua A-chê-la-u nối ngôi vua cha là Hê-rốt mà trị vì tại xứ Giu-đê, nên Giô-sép sợ không dám về đó." },
      { day: 14, range: "Tổng duyệt 23 câu", text: "1 Khi Đức Chúa Jêsus đã sanh tại thành Bết-lê-hem, xứ Giu-đê, đang đời vua Hê-rốt.\n8 đặng ta cũng đến mà thờ lạy Ngài.\n14 Giô-sép bèn chờ dậy, đem con trẻ và mẹ Ngài đi ban đêm, lánh qua xứ Ê-díp-tô.\n23 đến ngụ tại một thành gọi là Na-xa-rét." }
    ];

    const mockPhrases = [
      "Sai rồi ní ơi! 🤦‍♂️",
      "Hổng đúng rồi bạn! 😜",
      "Lêu lêu trật lất! 🤪",
      "Hehe làm lại đi ní! 🙃",
      "Sai một ly đi một dặm nha ní! 😂",
      "Nhìn lại dấu câu kìa bạn ơi! 🧐",
      "Gõ ẩu là ăn hành nha ní! 🌶️"
    ];

    let activeDay = 0;
    let questions = [];
    let qIndex = 0;
    let streakCount = 0;
    let isTransitioning = false;

    function initDays() {
      const bar = document.getElementById('dayBar');
      bar.innerHTML = '';
      bibleVerses.forEach((d, idx) => {
        const btn = document.createElement('button');
        btn.className = `day-btn ${idx === activeDay ? 'active' : ''}`;
        btn.textContent = `N${d.day}: ${d.range}`;
        btn.onclick = () => selectDay(idx);
        bar.appendChild(btn);
      });
    }

    function selectDay(idx) {
      activeDay = idx;
      initDays();
      document.getElementById('titleDay').textContent = `Ngày ${bibleVerses[idx].day} • ${bibleVerses[idx].range}`;
      document.getElementById('fullVerseText').textContent = bibleVerses[idx].text;
      buildQuestions();
      qIndex = 0;
      streakCount = 0;
      updateStreak();
      loadQuestion();
    }

    function buildQuestions() {
      questions = [];
      const lines = bibleVerses[activeDay].text.split('\n');

      lines.forEach(line => {
        const words = line.trim().split(/\s+/);
        if (words.length < 4) return;
        let startIdx = /^\d+$/.test(words[0]) ? 1 : 0;

        for (let i = startIdx; i < words.length - 1; i += 3) {
          const phraseLength = Math.min((Math.random() < 0.5 ? 2 : 3), words.length - i);
          const targetWords = words.slice(i, i + phraseLength);
          const targetPhrase = targetWords.join(' ');

          const before = words.slice(0, i).join(' ');
          const after = words.slice(i + phraseLength).join(' ');

          questions.push({
            target: targetPhrase,
            wordCount: phraseLength,
            before: before,
            after: after
          });
        }
      });

      questions = questions.sort(() => Math.random() - 0.5).slice(0, 10);
    }

    function loadQuestion() {
      isTransitioning = false;
      const gameArea = document.getElementById('gameArea');
      gameArea.classList.remove('correct-anim', 'shake-anim');

      const input = document.getElementById('userInput');
      input.value = '';
      input.disabled = false;
      setTimeout(() => input.focus(), 50);

      if (questions.length === 0) {
        document.getElementById('sentenceBox').textContent = "Không đủ dữ liệu câu hỏi.";
        return;
      }

      const q = questions[qIndex];
      const percent = (qIndex / questions.length) * 100;
      document.getElementById('progressBar').style.width = `${percent}%`;

      document.getElementById('wordCountHint').textContent = `[Thiếu ${q.wordCount} từ]`;
      document.getElementById('sentenceBox').innerHTML = `${q.before} <span class="blank" id="blankSlot">.....</span> ${q.after}`;
    }

    function updateStreak() {
      document.getElementById('scoreDisplay').textContent = `Chuỗi đúng: ${streakCount}`;
    }

    function checkAnswer() {
      if (isTransitioning) return;

      const input = document.getElementById('userInput');
      const entered = input.value.trim();
      const q = questions[qIndex];
      const gameArea = document.getElementById('gameArea');

      if (!entered) return;

      // So khớp tuyệt đối 100%: phân biệt hoa thường, dấu câu, khoảng trắng nội tại
      if (entered === q.target) {
        // XỬ LÝ KHI ĐÚNG
        isTransitioning = true;
        input.disabled = true;
        streakCount++;
        updateStreak();

        // Hiệu ứng rung nhẹ trên điện thoại
        if (navigator.vibrate) navigator.vibrate(60);

        gameArea.classList.add('correct-anim');
        const blank = document.getElementById('blankSlot');
        blank.textContent = q.target;
        blank.style.color = 'var(--green)';

        // Tự động nhảy sang câu tiếp theo sau 800ms
        setTimeout(() => {
          qIndex++;
          if (qIndex >= questions.length) {
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('sentenceBox').innerHTML = `<div style="text-align:center; color:var(--green); font-weight:bold; font-size:1.3rem;">🎉 Xuất sắc! Bạn đã vượt qua bài test hôm nay!</div>`;
            document.getElementById('wordCountHint').textContent = '';
            document.querySelector('.input-group').style.display = 'none';
          } else {
            loadQuestion();
          }
        }, 850);

      } else {
        // XỬ LÝ KHI SAI
        streakCount = 0;
        updateStreak();

        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

        gameArea.classList.add('shake-anim');
        setTimeout(() => gameArea.classList.remove('shake-anim'), 450);

        // Bật Modal Chế Giễu
        const randMock = mockPhrases[Math.floor(Math.random() * mockPhrases.length)];
        document.getElementById('mockTitleText').textContent = randMock;
        document.getElementById('correctRevealText').textContent = q.target;
        document.getElementById('mockModal').style.display = 'flex';
      }
    }

    function closeModalAndRetry() {
      document.getElementById('mockModal').style.display = 'none';
      const input = document.getElementById('userInput');
      input.value = '';
      input.focus();
    }

    document.getElementById('userInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        checkAnswer();
      }
    });

    function switchView(mode) {
      if (mode === 'game') {
        document.getElementById('gameArea').style.display = 'flex';
        document.getElementById('progressWrap').style.display = 'block';
        document.getElementById('readArea').style.display = 'none';
        document.getElementById('btnGame').classList.add('active');
        document.getElementById('btnRead').classList.remove('active');
      } else {
        document.getElementById('gameArea').style.display = 'none';
        document.getElementById('progressWrap').style.display = 'none';
        document.getElementById('readArea').style.display = 'flex';
        document.getElementById('btnGame').classList.remove('active');
        document.getElementById('btnRead').classList.add('active');
      }
    }

    initDays();
    selectDay(0);
  </script>
</body>
</html>
